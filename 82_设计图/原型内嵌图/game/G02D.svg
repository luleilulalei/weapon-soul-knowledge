<svg xmlns="http://www.w3.org/2000/svg" width="844" height="390" viewBox="0 0 844 390"><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101D35"/><stop offset=".62" stop-color="#142A3B"/><stop offset="1" stop-color="#172333"/></linearGradient>
<linearGradient id="floor" x2="0" y2="1"><stop stop-color="#233347"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
<linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#506979"/><stop offset=".35" stop-color="#263B50"/><stop offset="1" stop-color="#101B2E"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7DC9E"/><stop offset=".5" stop-color="#9E7948"/><stop offset="1" stop-color="#54432F"/></linearGradient>
<linearGradient id="whiteBlade" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".25" stop-color="#B7FFF2"/><stop offset="1" stop-color="#5BBAB9"/></linearGradient>
<linearGradient id="mist"><stop stop-color="#72E5DB" stop-opacity="0"/><stop offset=".5" stop-color="#72E5DB" stop-opacity=".18"/><stop offset="1" stop-color="#72E5DB" stop-opacity="0"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#72E5DB" stop-opacity=".25"/><stop offset="1" stop-color="#72E5DB" stop-opacity="0"/></radialGradient>
<radialGradient id="warmAura"><stop stop-color="#E7BD79" stop-opacity=".3"/><stop offset="1" stop-color="#E7BD79" stop-opacity="0"/></radialGradient>
<linearGradient id="panel"><stop stop-color="#0B1020" stop-opacity=".98"/><stop offset="1" stop-color="#0B1020" stop-opacity=".55"/></linearGradient>
<linearGradient id="topShade" x2="0" y2="1"><stop stop-color="#070D19" stop-opacity=".95"/><stop offset="1" stop-color="#070D19" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
</defs><rect x="0" y="0" width="844" height="390" rx="0" fill="#0B1020" opacity="1"/><circle cx="770" cy="50" r="170" fill="url(#aura)" /><rect x="0" y="0" width="80" height="390" rx="0" fill="#0F172A" opacity="1"/><line x1="80" y1="20" x2="80" y2="370" stroke="#28364D" stroke-width="0.8" stroke-linecap="round" /><circle cx="40" cy="40" r="21" fill="#1C293E" stroke="#34445B" stroke-width="1" /><g transform="translate(29 28) scale(0.9166666666666666)" ><path d="M8 7a4 4 0 108 0 4 4 0 10-8 0M4 21v-2a8 8 0 0116 0v2" fill="none" stroke="#BCC7D7" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(28 124) scale(1)" color="#93A3BC"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.65" /><path d="M8 10v3M16 10v3" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" /></g><text x="40" y="165" font-size="11" fill="#93A3BC" font-weight="400" text-anchor="middle">器灵</text><rect x="12" y="186" width="56" height="62" rx="18" fill="#72E5DB14" opacity="1"/><g transform="translate(28 198) scale(1)" color="#72E5DB"><path d="M6 18L17 7l1-4-4 1L3 15M5 13l6 6M3 21l3-3" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" /></g><text x="40" y="239" font-size="11" fill="#72E5DB" font-weight="600" text-anchor="middle">训练</text><g transform="translate(28 272) scale(1)" color="#93A3BC"><path d="M4 4h7l1 2 1-2h7v16h-7l-1 1-1-1H4zM12 6v15" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" /></g><text x="40" y="313" font-size="11" fill="#93A3BC" font-weight="400" text-anchor="middle">收藏</text><text x="40" y="371" font-size="8" fill="#93A3BC" font-weight="600" text-anchor="middle" letter-spacing="1.4">SPIRIT</text><text x="104" y="47" font-size="27" fill="#F4F3ED" font-weight="700" text-anchor="start">开始前，准备好</text><text x="104" y="72" font-size="12" fill="#98A8BE" font-weight="400" text-anchor="start">本次挑战 · 辨向</text><rect x="104" y="95" width="288" height="81" rx="18" fill="#151E32" opacity="1" stroke="#2C3A51" stroke-width="1"/><g transform="translate(143 134) scale(0.62)" ><circle cx="0" cy="0" r="42" fill="url(#aura)" /><path d="M-25 0 Q-16 -8 -8 -3 L-8 4 Q-16 5 -25 0Z" fill="#72E5DB" /><path d="M8 -3 Q16 -8 25 0 Q16 5 8 4Z" fill="#72E5DB" /></g><text x="180" y="124" font-size="20" fill="#F4F3ED" font-weight="700" text-anchor="start">雾光</text><text x="180" y="148" font-size="11" fill="#98A8BE" font-weight="400" text-anchor="start">训练剑 · 当前器灵</text><text x="180" y="165" font-size="10" fill="#72E5DB" font-weight="400" text-anchor="start">手机与器灵已连接</text><text x="104" y="205" font-size="16" fill="#F4F3ED" font-weight="600" text-anchor="start">设备检查</text><text x="392" y="204" font-size="11" fill="#98A8BE" font-weight="400" text-anchor="end">已更新</text><circle cx="114" cy="230" r="10" fill="#72E5DB22" /><path d="M110 230 l3 3 l6 -7" fill="none" stroke="#72E5DB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><text x="134" y="235" font-size="12" fill="#F4F3ED" font-weight="400" text-anchor="start">剑身已识别，当前可用</text><circle cx="114" cy="262" r="10" fill="#72E5DB22" /><path d="M110 262 l3 3 l6 -7" fill="none" stroke="#72E5DB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><text x="134" y="267" font-size="12" fill="#F4F3ED" font-weight="400" text-anchor="start">未充电 · 未入座</text><circle cx="114" cy="294" r="10" fill="#72E5DB22" /><path d="M110 294 l3 3 l6 -7" fill="none" stroke="#72E5DB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><text x="134" y="299" font-size="12" fill="#F4F3ED" font-weight="400" text-anchor="start">未发现设备风险提示</text><rect x="104" y="320" width="288" height="45" rx="12" fill="#241F25" opacity="1"/><text x="119" y="339" font-size="10" fill="#E7BD79" font-weight="600" text-anchor="start">感觉不安全，就停下并放下剑。</text><text x="119" y="355" font-size="10" fill="#98A8BE" font-weight="400" text-anchor="start">无需为了避免失败继续动作。</text><text x="416" y="45" font-size="14" fill="#F4F3ED" font-weight="600" text-anchor="start">本局使用剑技</text><rect x="416" y="64" width="404" height="45" rx="13" fill="#151E32" opacity="1" stroke="#2C3A51" stroke-width="1"/><text x="618" y="93" font-size="15" fill="#72E5DB" font-weight="600" text-anchor="middle">基础斩 · 左 / 右辨向</text><rect x="416" y="135" width="20" height="20" rx="6" fill="#72E5DB" opacity="1"/><path d="M421 145l3 3l7-8" fill="none" stroke="#0B1020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><text x="449" y="150" font-size="16" fill="#F4F3ED" font-weight="600" text-anchor="start">手机已经放稳</text><text x="449" y="173" font-size="12" fill="#98A8BE" font-weight="400" text-anchor="start">面向屏幕，回到可看清提示的位置</text><rect x="416" y="195" width="20" height="20" rx="6" fill="#72E5DB" opacity="1"/><path d="M421 205l3 3l7-8" fill="none" stroke="#0B1020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><text x="449" y="210" font-size="16" fill="#F4F3ED" font-weight="600" text-anchor="start">周围有充足空间</text><text x="449" y="233" font-size="12" fill="#98A8BE" font-weight="400" text-anchor="start">确认挥动范围没有人或障碍物</text><rect x="416" y="274" width="404" height="48" rx="14" fill="#72E5DB" opacity="1"/><text x="618.0" y="304.0" font-size="16" fill="#0B1020" font-weight="700" text-anchor="middle">放稳手机，8 秒后准备</text><text x="618" y="349" font-size="11" fill="#98A8BE" font-weight="400" text-anchor="middle">倒计时后先校准，本页不开始计分</text></svg>