" font-weight="500" text-anchor="middle">守门者 · 本局已结束</text><circle cx="236" cy="140" r="92" fill="url(#aura)" /><text x="236" y="150" font-size="49" fill="#F4F3ED" font-weight="500" text-anchor="middle">0 / 3</text><text x="236" y="183" font-size="13" fill="#98A8BE" font-weight="500" text-anchor="middle">剩余生命</text><path d="M202 215l9-6l9 6l-3 11l-6 4l-6-4Z" fill="#29384B" /><path d="M227 215l9-6l9 6l-3 11l-6 4l-6-4Z" fill="#29384B" /><path d="M252 215l9-6l9 6l-3 11l-6 4l-6-4Z" fill="#29384B" /><text x="236" y="272" font-size="24" fill="#F4F3ED" font-weight="700" text-anchor="middle">这一局，差一点</text><text x="236" y="302" font-size="11" fill="#98A8BE" font-weight="400" text-anchor="middle">三次防御未完成，本局结束</text><text x="236" y="338" font-size="11" fill="#98A8BE" font-weight="400" text-anchor="middle">不用更快，也不用更用力。</text><text x="392" y="53" font-size="14" fill="#E7BD79" font-weight="600" text-anchor="start">这次先调整一件事</text><rect x="392" y="74" width="428" height="114" rx="17" fill="#151E32" opacity="1" stroke="#2C3A51" stroke-width="1"/><text x="414" y="114" font-size="19" fill="#F4F3ED" font-weight="600" text-anchor="start">等“现在格挡”亮起，再持势。</text><text x="414" y="147" font-size="12" fill="#98A8BE" font-weight="400" text-anchor="start">主要原因：两次格挡过早</text><text x="414" y="172" font-size="11" fill="#98A8BE" font-weight="400" text-anchor="start">先回起始姿态，再跟随下一次提示。</text><rect x="392" y="207" width="428" height="48" rx="14" fill="#72E5DB" opacity="1"/><text x="606.0" y="237.0" font-size="16" fill="#0B1020" font-weight="700" text-anchor="middle">重新准备，再试一次</text><rect x="392" y="269" width="428" height="44" rx="14" fill="#151E32" opacity="1" stroke="#2C3A51" stroke-width="1"/><text x="606.0" y="297.0" font-size="16" fill="#F4F3ED" font-weight="700" text-anchor="middle">回看格挡动作</text><text x="606" y="351" font-size="13" fill="#98A8BE" font-weight="500" text-anchor="middle">回训练场休息</text></svg>