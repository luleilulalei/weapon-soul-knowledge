ll="#F4F3ED" font-size="22" font-weight="700" >记忆与隐私</text><rect x="104" y="86" width="304" height="127" rx="20" fill="#192A39" stroke="none" stroke-width="1"/><g transform="translate(125 108) scale(1.0833333333333333)" stroke="#E7BD79" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M9 5a3 3 0 016 0v5M9 9v3a3 3 0 004.5 2.6M6 11v1a6 6 0 009.7 4.7M18 12v-1M12 18v4M9 22h6M3 3l18 18"/></g><text x="125" y="166" fill="#F4F3ED" font-size="18" font-weight="600" >雾光的麦克风已关闭</text><text x="125" y="195" fill="#93A3BC" font-size="11" font-weight="400" >停止采集 · 恢复请在实体上操作</text><text x="104" y="251" fill="#F4F3ED" font-size="20" font-weight="600" >长期记忆</text><text x="104" y="284" fill="#BCC7D7" font-size="13" font-weight="400" >对话不会自动成为长期记忆。</text><text x="104" y="309" fill="#BCC7D7" font-size="13" font-weight="400" >只属于你和雾光的内容，</text><text x="104" y="334" fill="#BCC7D7" font-size="13" font-weight="400" >不会向访客展示。</text><rect x="448" y="86" width="372" height="65" rx="20" fill="#151E32" stroke="none" stroke-width="1"/><g transform="translate(466 106) scale(0.9166666666666666)" stroke="#72E5DB" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M4 4h7l1 2 1-2h7v16h-7l-1 1-1-1H4zM12 6v15"/></g><text x="501" y="110" fill="#F4F3ED" font-size="16" font-weight="600" >管理已保存的记忆</text><text x="501" y="134" fill="#93A3BC" font-size="11" font-weight="400" >每条都能查看来源或删除</text><g transform="translate(792 108) scale(0.7916666666666666)" stroke="#93A3BC" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M9 5l7 7-7 7"/></g><text x="448" y="190" fill="#F4F3ED" font-size="15" font-weight="500" >对话在器灵实体上进行</text><text x="448" y="218" fill="#93A3BC" font-size="12" font-weight="400" >手机只管理记忆、设置与游戏。</text><path d="M448 235H820" stroke="#27334B" stroke-width="0.7"/><text x="448" y="270" fill="#F4F3ED" font-size="15" font-weight="500" >实体陪伴时提起已有记忆</text><rect x="778" y="249" width="42" height="25" rx="13" fill="#354158" stroke="none" stroke-width="1"/><circle cx="791" cy="261.5" r="9" fill="#BCC7D7" stroke="none" stroke-width="1"/><text x="448" y="298" fill="#93A3BC" font-size="12" font-weight="400" >默认关闭；游戏端不提供对话入口。</text><path d="M448 315H820" stroke="#27334B" stroke-width="0.7"/><text x="448" y="351" fill="#93A3BC" font-size="12" font-weight="400" >离线练习只反馈当次成绩，不补长期成长。</text></g></svg>