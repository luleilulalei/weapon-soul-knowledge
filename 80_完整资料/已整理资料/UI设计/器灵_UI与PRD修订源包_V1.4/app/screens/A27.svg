ll="#F4F3ED" font-size="22" font-weight="700" >雾光记得的</text><text x="820" y="48" fill="#93A3BC" font-size="12" font-weight="400" text-anchor="end">隐私设置</text><text x="104" y="115" fill="#F4F3ED" font-size="26" font-weight="700" >留下的，</text><text x="104" y="151" fill="#F4F3ED" font-size="26" font-weight="700" >都是你允许的。</text><text x="104" y="188" fill="#93A3BC" font-size="12" font-weight="400" >2 条可用 · 1 条待清理</text><rect x="104" y="218" width="304" height="35" rx="17" fill="#111B2D" stroke="none" stroke-width="1"/><rect x="107" y="221" width="76" height="29" rx="14" fill="#293A50" stroke="none" stroke-width="1"/><text x="145" y="241" fill="#F4F3ED" font-size="12" font-weight="600" text-anchor="middle">全部</text><text x="242" y="241" fill="#93A3BC" font-size="12" font-weight="400" text-anchor="middle">共同经历</text><text x="352" y="241" fill="#93A3BC" font-size="12" font-weight="400" text-anchor="middle">称呼偏好</text><g transform="translate(104 296) scale(0.9583333333333334)" stroke="#72E5DB" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 3l8 3v7c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/></g><text x="142" y="304" fill="#93A3BC" font-size="12" font-weight="400" >每条都能查看来源或删除。</text><text x="142" y="328" fill="#93A3BC" font-size="12" font-weight="400" >删除记忆不会撤回已获得的剑技。</text><rect x="448" y="84" width="372" height="81" rx="18" fill="#292D36" stroke="none" stroke-width="1"/><g transform="translate(465 99) scale(0.9166666666666666)" stroke="#E7BD79" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 8v5l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0"/></g><text x="500" y="113" fill="#F4F3ED" font-size="16" font-weight="600" >第一次完成节拍</text><text x="467" y="137" fill="#BCC7D7" font-size="12" font-weight="400" >已停止新回顾 · 等待设备清理</text><text x="467" y="157" fill="#E7BD79" font-size="10.5" font-weight="400" >查看处理进度</text><rect x="448" y="177" width="372" height="81" rx="18" fill="#151E32" stroke="none" stroke-width="1"/><g transform="translate(465 192) scale(0.9166666666666666)" stroke="#72E5DB" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M8 7a4 4 0 108 0 4 4 0 10-8 0M4 21v-2a8 8 0 0116 0v2"/></g><text x="500" y="206" fill="#F4F3ED" font-size="16" font-weight="600" >你希望我怎么称呼你</text><text x="467" y="230" fill="#BCC7D7" font-size="12" font-weight="400" >“叫我阿澄就好。”</text><text x="467" y="250" fill="#93A3BC" font-size="10.5" font-weight="400" >10月15日 · 你明确要求记住</text><rect x="448" y="270" width="372" height="81" rx="18" fill="#151E32" stroke="none" stroke-width="1"/><g transform="translate(465 285) scale(0.9166666666666666)" stroke="#72E5DB" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M4 4h7l1 2 1-2h7v16h-7l-1 1-1-1H4zM12 6v15"/></g><text x="500" y="299" fill="#F4F3ED" font-size="16" font-weight="600" >练习时，先慢一点</text><text x="467" y="323" fill="#BCC7D7" font-size="12" font-weight="400" >你更喜欢先看演示，再自己尝试。</text><text x="467" y="343" fill="#93A3BC" font-size="10.5" font-weight="400" >10月15日 · 你明确要求记住</text></g></svg>