ll="#F4F3ED" font-size="22" font-weight="700" >雾光记得的</text><text x="820" y="48" fill="#93A3BC" font-size="12" font-weight="400" text-anchor="end">隐私设置</text><text x="104" y="115" fill="#F4F3ED" font-size="26" font-weight="700" >留下的，</text><text x="104" y="151" fill="#F4F3ED" font-size="26" font-weight="700" >都是你允许的。</text><text x="104" y="188" fill="#93A3BC" font-size="12" font-weight="400" >0 条记忆 · 仅主人可见</text><rect x="104" y="218" width="304" height="35" rx="17" fill="#111B2D" stroke="none" stroke-width="1"/><rect x="107" y="221" width="76" height="29" rx="14" fill="#293A50" stroke="none" stroke-width="1"/><text x="145" y="241" fill="#F4F3ED" font-size="12" font-weight="600" text-anchor="middle">全部</text><text x="242" y="241" fill="#93A3BC" font-size="12" font-weight="400" text-anchor="middle">共同经历</text><text x="352" y="241" fill="#93A3BC" font-size="12" font-weight="400" text-anchor="middle">称呼偏好</text><g transform="translate(104 296) scale(0.9583333333333334)" stroke="#72E5DB" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 3l8 3v7c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/></g><text x="142" y="304" fill="#93A3BC" font-size="12" font-weight="400" >每条都能查看来源或删除。</text><text x="142" y="328" fill="#93A3BC" font-size="12" font-weight="400" >删除记忆不会撤回已获得的剑技。</text><rect x="448" y="84" width="372" height="267" rx="20" fill="#151E32" stroke="none" stroke-width="1"/><g transform="translate(611 129) scale(1.9166666666666667)" stroke="#93A3BC" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M4 4h7l1 2 1-2h7v16h-7l-1 1-1-1H4zM12 6v15"/></g><text x="634" y="227" fill="#F4F3ED" font-size="21" font-weight="600" text-anchor="middle">还没有保存的记忆</text><text x="487" y="268" fill="#93A3BC" font-size="12" font-weight="400" >这里仅展示已经保存的记忆。</text><text x="487" y="295" fill="#93A3BC" font-size="12" font-weight="400" >不保存，也不影响陪伴和已获得的剑技。</text></g></svg>