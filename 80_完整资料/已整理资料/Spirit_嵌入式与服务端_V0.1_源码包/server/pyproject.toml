[project]
name = "usaki-server"
version = "0.1.0"
description = "Python service layer for Usaki soft-hardware coordination."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.2",
    "uvicorn[standard]>=0.49.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "websockets>=16.0",
    "python-dotenv>=1.2.2",
    "SQLAlchemy>=2.0,<3.0",
    "opuslib_next>=1.1.5",
    "numpy>=2.0",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
